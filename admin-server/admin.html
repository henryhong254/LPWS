<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin – Lịch Học</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d0f1a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #161933;
      border: 1px solid rgba(201,168,76,0.25);
      border-radius: 16px;
      padding: 36px 32px;
      width: 100%;
      max-width: 400px;
    }
    h1 { font-size: 1.2rem; color: #c9a84c; margin-bottom: 4px; }
    .subtitle { font-size: 0.82rem; color: #666; margin-bottom: 28px; }
    .field { margin-bottom: 18px; }
    label { display: block; font-size: 0.8rem; color: #aaa; margin-bottom: 6px; }
    input {
      width: 100%;
      background: #0d0f1a;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 10px 14px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: rgba(201,168,76,0.5); }
    .divider { border: none; border-top: 1px solid rgba(255,255,255,0.07); margin: 22px 0; }
    .btn {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #c9a84c, #a07830);
      border: none;
      border-radius: 8px;
      color: #000;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    #msg {
      margin-top: 14px;
      padding: 11px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
      display: none;
      text-align: center;
    }
    #msg.ok  { background: rgba(46,204,113,0.12); border: 1px solid rgba(46,204,113,0.35); color: #2ecc71; }
    #msg.err { background: rgba(231,76,60,0.12);  border: 1px solid rgba(231,76,60,0.35);  color: #e74c3c; }
  </style>
</head>
<body>
<div class="card">
  <h1>⚙️ Cập nhật lịch học</h1>
  <p class="subtitle">Thay đổi có hiệu lực ngay sau khi lưu.</p>

  <form id="form">
    <div class="field">
      <label>Tên khóa</label>
      <input type="text" id="batch" placeholder="K03" />
    </div>

    <div class="field">
      <label>Buổi 1 – Online</label>
      <input type="date" id="day1" />
    </div>

    <div class="field">
      <label>Buổi 2 – Offline TP.HCM</label>
      <input type="date" id="day2" />
    </div>

    <div class="field">
      <label>Buổi 3 – Nâng Cao (Offline)</label>
      <input type="date" id="day3" />
    </div>

    <div class="field">
      <label>Early Bird kết thúc</label>
      <input type="date" id="eb" />
    </div>

    <hr class="divider" />

    <div class="field">
      <label>Mật khẩu admin</label>
      <input type="password" id="password" required />
    </div>

    <button type="submit" class="btn" id="btn">Lưu thay đổi</button>
    <div id="msg"></div>
  </form>
</div>

<script>
  // Helper: "2026-06-27" → "27/06/2026"
  function toFull(val) {
    if (!val) return '';
    const [y, m, d] = val.split('-');
    return d + '/' + m + '/' + y;
  }
  // Helper: "2026-06-27" → "27/6"
  function toShort(val) {
    if (!val) return '';
    const [, m, d] = val.split('-');
    return parseInt(d) + '/' + parseInt(m);
  }
  // Helper: "2026-06-22" → "2026-06-22T23:59:59+07:00"
  function toDeadline(val) {
    return val + 'T23:59:59+07:00';
  }
  // Helper: "27/06/2026" → "2026-06-27" (for pre-filling date input)
  function toInputDate(full) {
    if (!full) return '';
    const [d, m, y] = full.split('/');
    return y + '-' + m + '-' + d;
  }
  // Helper: "2026-06-22T23:59:59+07:00" → "2026-06-22"
  function fromDeadline(iso) {
    return iso ? iso.slice(0, 10) : '';
  }

  // Load current schedule to pre-fill
  fetch('/api/schedule')
    .then(r => r.json())
    .then(s => {
      document.getElementById('batch').value = s.batch || '';
      document.getElementById('day1').value  = toInputDate(s.day1Date);
      document.getElementById('day2').value  = toInputDate(s.day2Date);
      document.getElementById('day3').value  = toInputDate(s.day3Date);
      document.getElementById('eb').value    = fromDeadline(s.earlyBirdDeadline);
    });

  document.getElementById('form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('btn');
    const msg = document.getElementById('msg');
    btn.disabled = true;
    btn.textContent = 'Đang lưu...';
    msg.style.display = 'none';

    const d1 = document.getElementById('day1').value;
    const d2 = document.getElementById('day2').value;
    const d3 = document.getElementById('day3').value;
    const eb = document.getElementById('eb').value;

    const body = {
      password: document.getElementById('password').value,
      batch: document.getElementById('batch').value.trim(),
      earlyBirdDeadline: toDeadline(eb),
      earlyBirdDate: eb ? (parseInt(eb.split('-')[2]) + '/' + parseInt(eb.split('-')[1])) : '',
      day1Date: toFull(d1),
      day1DateShort: toShort(d1),
      day2Date: toFull(d2),
      day2DateShort: toShort(d2),
      day3Date: toFull(d3),
      day3DateShort: toShort(d3),
    };

    try {
      const res  = await fetch('/api/schedule', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const json = await res.json();
      if (json.ok) {
        msg.className = 'ok';
        msg.textContent = '✓ Đã lưu! Trang web cập nhật ngay.';
      } else {
        msg.className = 'err';
        msg.textContent = '✗ ' + (json.error || 'Lỗi không xác định');
      }
    } catch {
      msg.className = 'err';
      msg.textContent = '✗ Không kết nối được server';
    }

    msg.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Lưu thay đổi';
  });
</script>
</body>
</html>
