<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin – Lịch Học</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d0f1a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #161933;
      border: 1px solid rgba(201,168,76,0.25);
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 480px;
    }
    h1 {
      font-size: 1.3rem;
      color: #c9a84c;
      margin-bottom: 6px;
      letter-spacing: 0.05em;
    }
    .subtitle {
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 32px;
    }
    .section-title {
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #c9a84c;
      margin: 24px 0 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(201,168,76,0.15);
    }
    .field { margin-bottom: 16px; }
    label {
      display: block;
      font-size: 0.8rem;
      color: #aaa;
      margin-bottom: 6px;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      background: #0d0f1a;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      padding: 10px 14px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: rgba(201,168,76,0.6); }
    .hint { font-size: 0.72rem; color: #666; margin-top: 4px; }
    .btn {
      width: 100%;
      margin-top: 28px;
      padding: 13px;
      background: linear-gradient(135deg, #c9a84c, #a07830);
      border: none;
      border-radius: 8px;
      color: #000;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    #msg {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      display: none;
      text-align: center;
    }
    #msg.ok  { background: rgba(46,204,113,0.15); border: 1px solid rgba(46,204,113,0.4); color: #2ecc71; }
    #msg.err { background: rgba(231,76,60,0.15);  border: 1px solid rgba(231,76,60,0.4);  color: #e74c3c; }
  </style>
</head>
<body>
<div class="card">
  <h1>⚙️ Admin – Lịch Học</h1>
  <p class="subtitle">Cập nhật lịch workshop. Thay đổi có hiệu lực ngay lập tức.</p>

  <form id="form">
    <div class="section-title">Thông tin khóa</div>

    <div class="field">
      <label>Tên khóa</label>
      <input type="text" name="batch" placeholder="K03" />
    </div>

    <div class="section-title">Early Bird</div>

    <div class="field">
      <label>Hạn Early Bird</label>
      <input type="text" name="earlyBirdDate" placeholder="22/06" />
      <div class="hint">Hiển thị trên trang (VD: 22/06)</div>
    </div>
    <div class="field">
      <label>Deadline countdown (ISO)</label>
      <input type="text" name="earlyBirdDeadline" placeholder="2026-06-22T23:59:59+07:00" />
      <div class="hint">Dùng cho đồng hồ đếm ngược. Format: YYYY-MM-DDTHH:MM:SS+07:00</div>
    </div>

    <div class="section-title">Lịch học</div>

    <div class="field">
      <label>Ngày 1 – Online (đầy đủ)</label>
      <input type="text" name="day1Date" placeholder="27/06/2026" />
    </div>
    <div class="field">
      <label>Ngày 1 – Online (rút gọn)</label>
      <input type="text" name="day1DateShort" placeholder="27/6" />
      <div class="hint">Hiển thị ở tagline hero</div>
    </div>

    <div class="field">
      <label>Ngày 2 – Offline (đầy đủ)</label>
      <input type="text" name="day2Date" placeholder="28/06/2026" />
    </div>
    <div class="field">
      <label>Ngày 2 – Offline (rút gọn)</label>
      <input type="text" name="day2DateShort" placeholder="28/6" />
    </div>

    <div class="field">
      <label>Ngày 3 – Nâng Cao (đầy đủ)</label>
      <input type="text" name="day3Date" placeholder="05/07/2026" />
    </div>
    <div class="field">
      <label>Ngày 3 – Nâng Cao (rút gọn)</label>
      <input type="text" name="day3DateShort" placeholder="05/7" />
    </div>

    <div class="section-title">Xác thực</div>

    <div class="field">
      <label>Mật khẩu admin</label>
      <input type="password" name="password" required />
    </div>

    <button type="submit" class="btn" id="btn">Lưu thay đổi</button>
    <div id="msg"></div>
  </form>
</div>

<script>
  // Load current schedule
  fetch('/api/schedule')
    .then(r => r.json())
    .then(data => {
      const form = document.getElementById('form');
      Object.keys(data).forEach(k => {
        const el = form.elements[k];
        if (el) el.value = data[k];
      });
    });

  document.getElementById('form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('btn');
    const msg = document.getElementById('msg');
    btn.disabled = true;
    btn.textContent = 'Đang lưu...';
    msg.style.display = 'none';

    const body = {};
    new FormData(this).forEach((v, k) => { body[k] = v.trim(); });

    try {
      const res = await fetch('/api/schedule', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const json = await res.json();
      if (json.ok) {
        msg.className = 'ok';
        msg.textContent = '✓ Đã lưu! Trang web đã cập nhật ngay.';
      } else {
        msg.className = 'err';
        msg.textContent = '✗ ' + (json.error || 'Lỗi không xác định');
      }
    } catch (err) {
      msg.className = 'err';
      msg.textContent = '✗ Không kết nối được server';
    }

    msg.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Lưu thay đổi';
  });
</script>
</body>
</html>
